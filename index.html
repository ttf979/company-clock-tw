<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公司打卡鐘</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#16202a;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand h1{margin:0;font-size:26px}.muted{color:#667085}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px}.grid{display:grid;gap:14px}.grid3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.clock{font-size:38px;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{min-width:0}input{border:1px solid #d0d5dd;border-radius:12px;padding:12px 14px;min-height:46px;background:white}button{border:0;border-radius:12px;min-height:44px;padding:10px 16px;cursor:pointer;font-weight:700}.primary{background:#1f6feb;color:#fff}.secondary{background:#eef2f6;color:#1d2939}.danger{background:#fff1f0;color:#b42318}.good{background:#ecfdf3;color:#027a48}.employee{position:relative}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#eef2f6}.big{font-size:22px;font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric{background:#f8fafc;border-radius:12px;padding:10px}.metric b{display:block;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .full{grid-column:1/-1}.hidden{display:none!important}.auth{max-width:560px;margin:50px auto}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.active{background:#1f6feb;color:white}.form{display:grid;gap:10px}.form input{width:100%}.msg{min-height:22px;margin-top:8px}.summary{display:flex;gap:12px;flex-wrap:wrap}.pill{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:12px 16px}table{width:100%;border-collapse:collapse;font-size:14px;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #eaecf0;white-space:nowrap}.tableWrap{overflow:auto;border:1px solid #e4e7ec;border-radius:16px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px}.sectionTitle h2{font-size:18px;margin:0}@media(max-width:640px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.clock{font-size:32px}.actions{grid-template-columns:1fr}.actions .full{grid-column:auto}}
</style></head><body>
<div id="authView" class="wrap auth">
  <div class="card"><h1>公司打卡鐘</h1><p class="muted">每家公司獨立帳號、獨立資料。</p><div class="tabs"><button id="tabLogin" class="active">公司登入</button><button id="tabRegister" class="secondary">建立公司帳號</button></div>
  <form id="loginForm" class="form"><input id="loginCode" placeholder="公司代號" required><input id="loginPw" type="password" placeholder="密碼" required><button class="primary">登入</button></form>
  <form id="registerForm" class="form hidden"><input id="regName" placeholder="公司名稱" required><input id="regCode" placeholder="公司代號（英文/數字）" required><input id="regPw" type="password" placeholder="密碼（至少6碼）" required><button class="primary">建立並登入</button></form><div id="authMsg" class="msg muted"></div></div>
</div>
<p style="text-align:center"><a href="/employee.html">員工打卡入口</a></p>
<div id="appView" class="wrap hidden">
  <div class="top"><div class="brand"><h1>公司打卡鐘</h1><div id="companyName" class="muted"></div></div><div class="row"><button id="logoutBtn" class="secondary">登出</button></div></div>
  <div class="grid grid3"><div class="card"><div class="muted">現在時間</div><div id="now" class="clock">--:--:--</div><div id="date" class="muted"></div></div><div class="card"><div class="muted">計薪規則</div><div class="big">$600 / 小時</div><div class="muted">每 30 分鐘為一個計薪單位</div></div><div class="card"><div class="muted">新增 / 上班打卡</div><div class="row" style="margin-top:8px"><input id="employeeCode" placeholder="員工代號" style="flex:1"><input id="workRoom" placeholder="包廂"><input id="workCustomer" placeholder="客戶姓名"><button id="clockInBtn" class="primary">上班</button></div><div id="appMsg" class="msg muted"></div></div></div>
  <div class="card" style="margin-top:14px"><h2 style="font-size:18px">建立員工登入帳號</h2><form id="employeeAccountForm" class="row"><input id="newEmployee" required placeholder="員工代號"><input id="newEmployeePw" required type="password" minlength="6" placeholder="員工密碼（至少6碼）" autocomplete="new-password"><button class="primary">建立帳號</button></form><p class="muted">員工使用公司代號、員工代號及自己的密碼登入。<a href="/employee.html">開啟員工版</a></p><div id="employeeAccountMsg" role="status"></div></div>
<div class="sectionTitle"><h2>目前上班中</h2><div id="activeCount" class="badge">0 人</div></div><div id="activeList" class="grid grid3"></div>
  <div class="sectionTitle"><h2>今日 / 歷史結算</h2><div class="summary"><div class="pill">完成班次 <b id="shiftCount">0</b></div><div class="pill">總薪資 <b id="totalPay">$0</b></div></div></div>
  <div class="tableWrap"><table><thead><tr><th>代號</th><th>包廂／客戶</th><th>上班</th><th>下班</th><th>總時間</th><th>包廂時間</th><th>轉台時間</th><th>計薪時數</th><th>薪資</th></tr></thead><tbody id="history"></tbody></table></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const $=id=>document.getElementById(id); let state=null; let me=null; let timer=null;
const money=n=>'$'+Math.round(n).toLocaleString('zh-TW'); const dur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${h}時 ${m}分 ${ss}秒`}; const dt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false});
async function api(path,opt={}){const r=await fetch('/api/'+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'操作失敗');return j}
function authMode(mode){$('loginForm').classList.toggle('hidden',mode!=='login');$('registerForm').classList.toggle('hidden',mode!=='register');$('tabLogin').className=mode==='login'?'active':'secondary';$('tabRegister').className=mode==='register'?'active':'secondary';$('authMsg').textContent=''}
$('tabLogin').onclick=()=>authMode('login'); $('tabRegister').onclick=()=>authMode('register');
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify({companyCode:$('loginCode').value,password:$('loginPw').value})});await boot()}catch(e){$('authMsg').textContent=e.message}};
$('registerForm').onsubmit=async e=>{e.preventDefault();try{await api('register',{method:'POST',body:JSON.stringify({companyName:$('regName').value,companyCode:$('regCode').value,password:$('regPw').value})});await boot()}catch(e){$('authMsg').textContent=e.message}};
$('logoutBtn').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
$('clockInBtn').onclick=async()=>{const code=$('employeeCode').value.trim();if(!code)return;try{await api('clock-in',{method:'POST',body:JSON.stringify({code,room:$('workRoom').value,customer:$('workCustomer').value})});$('employeeCode').value='';await refresh()}catch(e){$('appMsg').textContent=e.message}};
$('employeeCode').addEventListener('keydown',e=>{if(e.key==='Enter')$('clockInBtn').click()});
async function action(path,code){try{await api(path,{method:'POST',body:JSON.stringify({code})});await refresh()}catch(e){$('appMsg').textContent=e.message}}
$('employeeAccountForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await api('employees',{method:'POST',body:JSON.stringify({code:$('newEmployee').value,password:$('newEmployeePw').value})});$('newEmployeePw').value='';$('employeeAccountMsg').textContent='員工帳號已建立';await refresh()}catch(e){$('employeeAccountMsg').textContent=e.message}finally{btn.disabled=false}};
async function refresh(){state=await api('state');render()}
function roomMs(p,now){return p.roomAccumMs+(p.status==='room'&&p.roomStartedAt?now-p.roomStartedAt:0)}
function transferMs(p,now){return p.transferAccumMs+(p.status==='transfer'&&p.transferStartedAt?now-p.transferStartedAt:0)}
function render(){if(!state)return;const now=Date.now();const active=Object.values(state.active||{});$('activeCount').textContent=active.length+' 人';const box=$('activeList');box.innerHTML='';
active.forEach(p=>{const total=now-p.start,room=roomMs(p,now),away=transferMs(p,now),bill=Math.max(30,Math.ceil((total/60000)/30)*30),pay=bill/60*600;const c=document.createElement('div');c.className='card employee';c.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="big">${esc(p.code)}</div><div class="muted">${esc(p.room||"未填包廂")} · ${esc(p.customer||"未填客戶")}</div><div class="muted">上班 ${new Date(p.start).toLocaleTimeString('zh-TW',{hour12:false})}</div></div><span class="badge ${p.status==='room'?'good':''}">${p.status==='room'?'包廂中':'轉台中'}</span></div><div class="metrics"><div class="metric"><span class="muted">總上班時間</span><b>${dur(total)}</b></div><div class="metric"><span class="muted">實際包廂</span><b>${dur(room)}</b></div></div><div class="muted" style="margin-bottom:10px">${p.transferStartedAt?"本次離開 "+dt(p.transferStartedAt)+" ・ ":""}轉台時間 ${dur(away)} ・ 目前預估 ${money(pay)}</div><div class="actions"><button class="primary toggle">${p.status==='room'?'轉台':'回台'}</button><button class="danger checkout">下班結算</button></div>`;c.querySelector('.toggle').onclick=()=>action(p.status==='room'?'transfer':'return',p.code);c.querySelector('.checkout').onclick=()=>action('clock-out',p.code);box.appendChild(c)});
const h=state.history||[];$('shiftCount').textContent=h.length;$('totalPay').textContent=money(h.reduce((a,r)=>a+r.pay,0));$('history').innerHTML=h.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.room)}／${esc(r.customer)}</td><td>${dt(r.start)}</td><td>${dt(r.end)}</td><td>${dur(r.totalMs)}</td><td>${dur(r.roomMs)}</td><td>${dur(r.transferMs)}</td><td>${(r.billMin/60).toFixed(1)} 小時</td><td><b>${money(r.pay)}</b></td></tr>`).join('')}
function tick(){const n=new Date();$('now').textContent=n.toLocaleTimeString('zh-TW',{hour12:false});$('date').textContent=n.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});render()}
async function boot(){try{me=await api('me');if(me.employeeCode){location.href='/employee.html';return}$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('companyName').textContent=me.company.companyName+'｜'+me.company.companyCode;await refresh();if(timer)clearInterval(timer);timer=setInterval(tick,1000);tick()}catch{$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}} boot();
</script></body></html>
