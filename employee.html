<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舞廳同步打卡鐘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#16202a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:1000px;margin:auto;padding:20px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 14px}p{line-height:1.6}.muted{color:#667085;font-size:14px}.top,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.card{background:white;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin:14px 0}.tabs{display:flex;gap:8px;margin:20px 0}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;min-height:46px;font-weight:700;background:#eef2f6;cursor:pointer}button.primary,.tabs .selected{background:#1f6feb;color:white}button.danger{background:#fff1f0;color:#b42318}button:disabled{opacity:.45;cursor:wait}input,select{padding:12px;border:1px solid #d0d5dd;border-radius:12px;background:white;min-width:0;width:100%;font-size:16px}label{display:block;font-size:14px;margin-bottom:6px}.field{flex:1;min-width:180px}.badge{padding:6px 10px;background:#ecfdf3;border-radius:99px;font-size:13px}.away{background:#fff8e8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.grid .card{margin:0}.time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}.metrics{display:flex;gap:20px;margin:14px 0;flex-wrap:wrap}.event{font-size:14px;padding:8px 0;border-top:1px solid #eaecf0}details{margin-top:12px}summary{cursor:pointer;padding:6px 0}.notice{background:#eef4ff;padding:14px;border-radius:12px}.message{min-height:24px;color:#b42318}a{color:#1f6feb}strong{overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:520px){.wrap{padding:14px}.row>button{width:100%}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.time{font-size:28px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>舞廳同步打卡鐘</h1><div class="muted">客人 × 小姐 · 共用同步 · 免登入</div></div><div id="sync" class="muted" role="status">連線中</div></div><div class="tabs"><button id="guestTab" class="selected">客人版</button><button id="employeeTab">小姐版</button></div>
<section id="guestControls"><div class="card"><h2>我的固定包廂</h2><div id="fixedGuest" class="notice" hidden></div><details id="guestSetup" open><summary>設定／選擇我的包廂與客人</summary><label for="guestSelect">目前包廂與客人</label><select id="guestSelect"><option value="">請選擇客人</option></select><details id="newGuest"><summary>新增客人入場</summary><form id="guestForm"><div class="row"><div class="field"><label for="guestName">客人稱呼</label><input id="guestName" required maxlength="40" placeholder="例如：王先生"></div><div class="field"><label for="room">包廂</label><input id="room" required maxlength="40" placeholder="例如：A08"></div><button class="primary">建立客人</button></div></form></details></details></div></section>
<section id="employeeControls" hidden><div class="card"><h2>我的服務紀錄</h2><label for="employeeName">小姐稱呼／代號</label><input id="employeeName" maxlength="40" placeholder="請使用固定且不重複的稱呼"><p class="muted">輸入自己的稱呼，即可查看不同客人的服務紀錄。</p></div></section>
<section id="startPanel" class="card"><div class="top"><h2 id="startTitle">新增小姐上班</h2><button id="employeeReset" type="button" hidden>歸零（新服務）</button></div><form id="startForm"><div class="row"><div id="serviceGuestField" class="field" hidden><label for="serviceGuestName">客人稱呼</label><input id="serviceGuestName" maxlength="40" placeholder="直接輸入這次服務的客人"></div><div id="serviceRoomField" class="field" hidden><label for="serviceRoom">包廂</label><input id="serviceRoom" maxlength="40" placeholder="例如：A08"></div><div id="serviceEmployeeField" class="field"><label for="serviceEmployee">小姐稱呼／代號</label><input id="serviceEmployee" maxlength="40" placeholder="輸入小姐稱呼"></div><button class="primary">上班打卡</button></div></form></section>
<div class="notice muted">每小時 $600，最低30分鐘，每30分鐘進位。轉台期間仍計入總上班時間；回台返回原包廂與原客人。</div><p id="message" class="message" role="alert"></p><div class="top"><h2 id="heading">目前服務</h2><span id="estimate"></span></div><div id="active" class="grid"></div>
<section id="checkoutPanel" class="card" hidden><div class="row"><div class="field"><strong>客人結帳離開</strong><p class="muted">一次結束此客人的所有服務，依各小姐的完整上班時間結算。</p></div><button id="checkout" class="danger">查看結帳明細</button></div><div id="checkoutReview" hidden><div id="review"></div><div class="row"><button id="confirmCheckout" class="danger">確認結帳離開</button><button id="cancelCheckout">取消</button></div></div></section>
<section class="card"><h2>已完成服務</h2><div id="history"></div></section><section id="dailyPanel" class="card" hidden><div class="top"><h2>本日工作結帳</h2><div><label for="workDate">上班開始日期</label><input id="workDate" type="date"></div></div><p class="muted">加總客人結帳紀錄；跨日服務歸入上班開始日。</p><div id="workDates" class="row" aria-label="有結帳紀錄的工作日"></div><div id="dailyTotals" class="metrics" aria-live="polite"></div><div id="dailyGuests"></div></section><section id="receiptPanel" class="card"><h2>客人結帳紀錄</h2><div id="receipts"></div></section><p class="muted">免登入共用模式：知道此網址的人都可以查看與操作。時間以伺服器紀錄為準；結帳是金額紀錄，不會扣款。<a href="/legacy-company.html">舊版入口</a></p></main>
<script src="/work-summary.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let mode=location.pathname.includes('employee')?'employee':'guest',state=null,offset=0,busy=false,last='',guestId=localStorage.getItem('hallGuest')||'';const dt=t=>new Date(t).toLocaleString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}),dur=ms=>{let s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')},pay=ms=>Math.max(30,Math.ceil(Math.max(0,ms)/60000/30)*30)*10,money=n=>'$'+n.toLocaleString('zh-TW'),now=()=>Date.now()+offset;
$('employeeName').value=localStorage.getItem('hallEmployee')||'';
async function api(path,body){const r=await fetch('/api/hall/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw new Error(j.error||'操作失敗');return j}
async function refresh(){const next=await api('state');offset=next.serverNow-Date.now();state=next;$('sync').textContent='已同步 '+new Date().toLocaleTimeString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'});const signature=JSON.stringify([state.guests,state.active,state.history,state.receipts]);if(signature!==last){last=signature;render()}tick()}
async function mutate(fn){if(busy)return;busy=true;$('message').textContent='';document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();await refresh()}catch(e){$('message').textContent=e.message;await refresh().catch(()=>{})}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function chooseMode(value){mode=value;$('guestTab').className=mode==='guest'?'selected':'';$('employeeTab').className=mode==='employee'?'selected':'';$('guestControls').hidden=mode!=='guest';$('employeeControls').hidden=mode!=='employee';$('serviceGuestField').hidden=mode!=='employee';$('serviceRoomField').hidden=mode!=='employee';$('serviceGuestName').required=mode==='employee';$('serviceRoom').required=mode==='employee';$('serviceEmployee').required=mode==='guest';$('serviceEmployeeField').hidden=mode==='employee';$('employeeReset').hidden=mode!=='employee';$('dailyPanel').hidden=mode!=='employee';$('startTitle').textContent=mode==='guest'?'新增小姐上班':'新增客人與包廂服務';$('checkoutReview').hidden=true;if(state)render()}
function currentGuest(){return state?.guests.find(g=>g.id===guestId)}function activeRows(){return Object.values(state?.active||{}).filter(p=>mode==='guest'?p.guestId===guestId:p.employee===$('employeeName').value.trim())}function historyRows(){const settledIds=new Set((state?.receipts||[]).flatMap(r=>r.records.map(h=>h.id)));return (state?.history||[]).filter(p=>!settledIds.has(p.id)&&(mode==='guest'?p.guestId===guestId:p.employee===$('employeeName').value.trim()))}
function eventMarkup(events){return events.map(e=>`<div class="event">${esc(dt(e.at))}　${esc(e.type)}${e.awayMs!=null?' · 離開 '+dur(e.awayMs):''}</div>`).join('')}
function render(){const open=new Set([...document.querySelectorAll('details[data-key][open]')].map(d=>d.dataset.key));const options='<option value="">請選擇客人</option>'+state.guests.map(g=>`<option value="${g.id}">${esc(g.room+' · '+g.name+(g.closedAt?'（已結帳）':''))}</option>`).join('');$('guestSelect').innerHTML=options;$('guestSelect').value=guestId;const g=currentGuest();$('fixedGuest').hidden=!g;$('fixedGuest').textContent=g?g.room+' · '+g.name+(g.closedAt?'（已結帳離開）':'（本次固定包廂）'):'';if(g&&!g.closedAt&&$('guestSetup').dataset.guest!==g.id){$('guestSetup').open=false;$('guestSetup').dataset.guest=g.id;}if(!g||g.closedAt)$('guestSetup').open=true;$('startPanel').hidden=mode==='guest'?(!g||!!g.closedAt):!$('employeeName').value.trim();$('checkoutPanel').hidden=mode!=='guest'||!g||!!g.closedAt;$('heading').textContent=mode==='guest'?(g?g.room+' · '+g.name:'請先新增或選擇客人'):($('employeeName').value.trim()||'請先輸入小姐稱呼');
$('active').innerHTML=activeRows().map(p=>`<article class="card"><div class="top"><strong>${esc(p.employee)}</strong><span class="badge ${p.status==='transfer'?'away':''}">${p.status==='transfer'?'轉台中':'原包廂中'}</span></div><p class="muted">${esc(p.room)} · ${esc(p.guestName)}<br>上班 ${esc(dt(p.start))}</p><div class="metrics"><div><div class="muted">總上班時間</div><div class="time" data-time="${p.id}"></div></div><div><div class="muted">預估薪資</div><strong data-pay="${p.id}"></strong></div></div>${p.awayAt?`<p class="away muted">離開 ${esc(dt(p.awayAt))}<br>已離開 <strong data-away="${p.id}"></strong></p>`:''}<div class="row"><button class="primary" data-action="${p.status==='transfer'?'return':'transfer'}" data-id="${p.id}">${p.status==='transfer'?'回台':'轉台'}</button><button class="danger" data-action="out" data-id="${p.id}">下班結算</button></div><details data-key="${p.id}"><summary>上班／轉台／回台紀錄</summary>${eventMarkup(p.events)}</details></article>`).join('')||'<p class="muted">目前沒有上班中的服務。</p>';
$('history').innerHTML=historyRows().map(h=>`<div class="row"><details style="flex:1" data-key="${h.id}"><summary>${esc(h.employee+' · '+h.room+' · '+h.guestName)} · ${money(h.pay)}</summary><p class="muted">${esc(dt(h.start))} → ${esc(dt(h.end))}<br>總上班 ${dur(h.totalMs)} · 計薪 ${h.billMin} 分鐘</p>${eventMarkup(h.events)}</details>${mode==='employee'?`<button class="primary" data-settle="${h.id}">結帳</button>`:''}</div>`).join('')||'<p class="muted">尚無已完成服務。</p>';
const receipts=state.receipts.filter(r=>mode==='guest'?r.guestId===guestId:r.records.some(h=>h.employee===$('employeeName').value.trim()));$('receipts').innerHTML=receipts.map(r=>`<details data-key="${r.id}"><summary>${esc(r.room+' · '+r.name)} · ${money(mode==='guest'?r.total:r.records.filter(h=>h.employee===$('employeeName').value.trim()).reduce((a,h)=>a+h.pay,0))}</summary><p class="muted">結帳 ${esc(dt(r.at))}</p>${r.records.filter(h=>mode==='guest'||h.employee===$('employeeName').value.trim()).map(h=>`<div class="event">${esc(h.employee)} · ${dur(h.totalMs)} · ${money(h.pay)}</div>`).join('')}</details>`).join('')||'<p class="muted">尚無結帳紀錄。</p>';renderDaily();document.querySelectorAll('details[data-key]').forEach(d=>d.open=open.has(d.dataset.key));tick()}
function tick(){if(!state)return;for(const p of activeRows()){$('active').querySelector(`[data-time="${p.id}"]`)?.replaceChildren(dur(now()-p.start));$('active').querySelector(`[data-pay="${p.id}"]`)?.replaceChildren(money(pay(now()-p.start)));if(p.awayAt)$('active').querySelector(`[data-away="${p.id}"]`)?.replaceChildren(dur(now()-p.awayAt))}if(mode==='guest'&&currentGuest()){$('estimate').textContent='合計 '+money(activeRows().reduce((a,p)=>a+pay(now()-p.start),0)+historyRows().reduce((a,h)=>a+h.pay,0))}else $('estimate').textContent='';if(!$('checkoutReview').hidden)review()}
function review(){const rows=[...historyRows(),...activeRows().map(p=>({...p,pay:pay(now()-p.start),billMin:pay(now()-p.start)/10}))];$('review').innerHTML=rows.map(p=>`<div class="event">${esc(p.employee)} · 計薪 ${p.billMin} 分鐘 · ${money(p.pay)}</div>`).join('')+`<p><strong>合計 ${money(rows.reduce((a,p)=>a+p.pay,0))}</strong></p><p class="muted">確認時以伺服器時間重新結算。</p>`;}
function renderDaily(){if(!state)return;const employee=$('employeeName').value.trim(),day=$('workDate').value,summary=hallWorkSummary.summarize(state.receipts,employee,day);$('workDates').replaceChildren(...summary.dates.map(date=>{const button=document.createElement('button');button.type='button';button.textContent=date;button.className=date===day?'primary':'';button.onclick=()=>{$('workDate').value=date;renderDaily()};return button}));$('dailyTotals').innerHTML=`<div><div class="muted">${esc(day)} 已結帳合計</div><strong class="time">${money(summary.total)}</strong></div><div><div class="muted">客人／服務筆數</div><strong>${summary.guests.length} 位 · ${summary.count} 筆</strong></div><div><div class="muted">計薪時數</div><strong>${(summary.billMin/60).toFixed(1)} 小時</strong></div>`;const opened=new Set([...$('dailyGuests').querySelectorAll('details[open]')].map(d=>d.dataset.dayGuest));$('dailyGuests').innerHTML=summary.guests.map(g=>`<details data-day-guest="${esc(g.key)}"><summary>${esc(g.room+' · '+g.name)} · ${money(g.total)} · ${g.records.length} 筆</summary>${g.records.map(h=>`<div class="event">上班 ${esc(dt(h.start))}<br>下班 ${esc(dt(h.end))}<br>計薪 ${h.billMin} 分鐘 · ${money(h.pay)}</div>`).join('')}</details>`).join('')||`<p class="muted">${employee?'此工作日尚無已結帳紀錄。':'請先輸入小姐稱呼。'}</p>`;$('dailyGuests').querySelectorAll('details').forEach(d=>d.open=opened.has(d.dataset.dayGuest));}
$('workDate').value=hallWorkSummary.workDate(Date.now());$('workDate').onchange=renderDaily;
$('employeeReset').onclick=()=>{$('serviceGuestName').value='';$('serviceRoom').value='';$('message').textContent='已歸零，請輸入下一位客人與包廂。已保存的服務與帳目保留。';$('serviceGuestName').focus()};$('history').onclick=e=>{const b=e.target.closest('button[data-settle]');if(b)mutate(async()=>{const j=await api('settle',{id:b.dataset.settle});$('message').textContent=(j.alreadySettled?'這筆服務已結帳：':'已結帳並移入客人結帳紀錄：')+money(j.receipt.total)})};$('guestTab').onclick=()=>chooseMode('guest');$('employeeTab').onclick=()=>chooseMode('employee');$('guestSelect').onchange=()=>{guestId=$('guestSelect').value;localStorage.setItem('hallGuest',guestId);$('checkoutReview').hidden=true;render()};$('employeeName').oninput=()=>{localStorage.setItem('hallEmployee',$('employeeName').value.trim());render()};$('guestForm').onsubmit=e=>{e.preventDefault();mutate(async()=>{const j=await api('guest',{name:$('guestName').value,room:$('room').value});guestId=j.guest.id;localStorage.setItem('hallGuest',guestId);$('guestName').value='';$('newGuest').open=false})};$('startForm').onsubmit=e=>{e.preventDefault();mutate(async()=>{const j=await api('start',mode==='guest'?{guestId,employee:$('serviceEmployee').value}:{guestName:$('serviceGuestName').value,room:$('serviceRoom').value,employee:$('employeeName').value});$('serviceEmployee').value='';if(j.alreadyActive)$('message').textContent='這筆服務已在上班中，已同步原有紀錄，沒有重複計時';})};$('active').onclick=e=>{const b=e.target.closest('button[data-action]');if(b)mutate(()=>api(b.dataset.action,{id:b.dataset.id}))};$('checkout').onclick=()=>{$('checkoutReview').hidden=false;review()};$('cancelCheckout').onclick=()=>{$('checkoutReview').hidden=true};$('confirmCheckout').onclick=()=>mutate(async()=>{const j=await api('checkout',{guestId});$('checkoutReview').hidden=true;$('message').textContent='已結帳離開：'+money(j.receipt.total)});chooseMode(mode);refresh().catch(e=>{$('message').textContent=e.message;$('sync').textContent='連線失敗'});setInterval(tick,1000);setInterval(()=>{if(!busy)refresh().catch(()=>{$('sync').textContent='同步中斷，請確認網路'})},3000);
</script></body></html>
