<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>員工打卡鐘</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#16202a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:480px;margin:auto;padding:20px}h1{font-size:26px;margin:0}.sub{color:#667085;font-size:14px;line-height:1.6}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 6px;font-size:14px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;background:white;font:inherit;font-size:16px}button{padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;min-height:48px;background:#eef2f6;color:#16202a;width:100%;margin-top:10px;cursor:pointer}button.main{background:#1f6feb;color:white}button.end{background:#fff1f0;color:#b42318}button:disabled{opacity:.4}.time{font-size:34px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}.pair{display:flex;justify-content:space-between;gap:12px;margin:12px 0;flex-wrap:wrap}.badge{background:#ecfdf3;padding:7px 12px;border-radius:20px;font-size:14px}.away{background:#fff8e8;padding:12px;border-radius:10px;line-height:1.7}.events{padding:0;list-style:none;margin:0}.events li{padding:12px 0;border-bottom:1px solid #eaecf0;font-size:14px}a{color:#1f6feb}.error{color:#b42318;min-height:24px;line-height:1.5}[hidden]{display:none!important}summary{cursor:pointer;padding:8px 0}strong{overflow-wrap:anywhere}
</style></head><body><main class="wrap"><h1>我的打卡鐘</h1><p id="identity" class="sub">員工專用入口</p>
<form id="login" class="panel"><label for="company">公司代號</label><input id="company" required autocomplete="organization"><label for="code">員工代號</label><input id="code" required autocomplete="username"><label for="password">員工密碼</label><input id="password" required type="password" autocomplete="current-password"><button class="main">登入</button><p class="sub">請向公司管理者取得員工帳號。</p><a href="/">公司管理者入口</a></form>
<section id="app" hidden><form id="startForm" class="panel"><label for="room">包廂</label><input id="room" required maxlength="40" placeholder="例如：A08"><label for="customer">客戶姓名</label><input id="customer" required maxlength="60" placeholder="輸入客戶姓名"><button class="main">上班打卡</button></form>
<section id="work" class="panel" hidden><div class="pair"><strong id="target"></strong><span id="status" class="badge"></span></div><div class="sub">總上班時間</div><div id="total" class="time"></div><div id="started" class="sub"></div><div class="pair"><span>目前預估薪資</span><strong id="pay"></strong></div><p class="sub">$600／小時 · 每30分鐘計薪，最低30分鐘<br>轉台期間持續計入上班時間</p><div id="away" class="away" hidden></div><button id="transfer" class="main">轉台・記錄離開</button><button id="return" class="main" hidden>回台・返回原包廂</button><button id="out" class="end">下班結算</button><details open><summary>本次工作紀錄</summary><ul id="events" class="events"></ul></details></section>
<section id="result" class="panel" hidden aria-live="polite"></section><section class="panel"><strong>我的歷史結算</strong><div id="history"></div></section><button id="logout">登出</button></section><p id="message" class="error" role="alert"></p></main>
<script>
const $=id=>document.getElementById(id);let me=null,state=null,busy=false,offset=0,historySignature="";const money=n=>'$'+n.toLocaleString('zh-TW'),time=t=>new Date(t).toLocaleString('zh-TW',{hour12:false}),dur=ms=>{let s=Math.floor(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
async function api(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let j=await r.json();if(!r.ok)throw new Error(j.error||'操作失敗');return j}
async function operate(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='';try{await fn()}catch(e){$('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function refresh(){state=await api('state');offset=state.serverNow-Date.now();render()}
function log(list,events){list.replaceChildren(...events.map(e=>{let li=document.createElement('li');li.textContent=time(e.at)+'　'+e.type;return li}))}
function render(){if(!state||!me)return;let p=state.active[me.employeeCode];$('startForm').hidden=!!p;$('work').hidden=!p;if(p){const now=Date.now()+offset;$('target').textContent=(p.room||'未填包廂')+' 包廂 · '+(p.customer||'未填客戶');$('status').textContent=p.status==='transfer'?'轉台中':'原包廂中';$('total').textContent=dur(now-p.start);$('started').textContent='上班 '+time(p.start);$('pay').textContent=money(Math.max(30,Math.ceil((now-p.start)/60000/30)*30)/60*600);$('away').hidden=p.status!=='transfer';$('away').textContent=p.transferStartedAt?'離開 '+time(p.transferStartedAt)+' · 已離開 '+dur(now-p.transferStartedAt):'';$('transfer').hidden=p.status!=='room';$('return').hidden=p.status!=='transfer';log($('events'),p.events||[])}
const signature=JSON.stringify(state.history);if(signature===historySignature)return;historySignature=signature; $('history').replaceChildren(...state.history.map(h=>{let d=document.createElement('details'),s=document.createElement('summary'),info=document.createElement('p'),ul=document.createElement('ul');s.textContent=time(h.end)+' · '+money(h.pay);info.className='sub';info.textContent=(h.room||'未填包廂')+' · '+(h.customer||'未填客戶')+'｜總上班 '+dur(h.totalMs)+'｜計薪 '+h.billMin+' 分鐘';ul.className='events';log(ul,h.events||[]);d.append(s,info,ul);return d}));if(!state.history.length)$('history').textContent='尚無結算紀錄';}
async function boot(){me=await api('me');if(!me.employeeCode){$('message').textContent='目前為公司管理者登入，請先登出後使用員工帳號。';$('login').hidden=true;$('app').hidden=true;const a=document.createElement('a');a.href='/';a.textContent='返回公司版';$('message').append(' ',a);return}$('identity').textContent=me.company.companyName+' · '+me.employeeCode;$('login').hidden=true;$('app').hidden=false;await refresh()}
$('login').onsubmit=e=>{e.preventDefault();operate(async()=>{await api('employee-login',{companyCode:$('company').value,code:$('code').value,password:$('password').value});$('password').value='';await boot()})};$('startForm').onsubmit=e=>{e.preventDefault();operate(async()=>{await api('clock-in',{room:$('room').value,customer:$('customer').value});$('result').hidden=true;await refresh()})};for(const [id,path] of [['transfer','transfer'],['return','return'],['out','clock-out']])$(id).onclick=()=>operate(async()=>{const result=await api(path,{});await refresh();if(id==='out'){$('result').hidden=false;$('result').textContent='本次結算 '+money(result.pay)+'｜計薪 '+result.billMin+' 分鐘（含轉台時間）'}});$('logout').onclick=()=>operate(async()=>{await api('logout',{});location.reload()});setInterval(()=>{if(state&&!busy)render()},1000);setInterval(()=>{if(me?.employeeCode&&!busy)refresh().catch(e=>{$('message').textContent=e.message})},15000);boot().catch(()=>{});
</script></body></html>
